<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chinese Tutor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="reader-pane">
        <header class="topbar">
          <div>
            <p class="eyebrow">Chinese Tutor</p>
            <h1>Mandarin reading desk</h1>
          </div>
          <div class="toolbar">
            <button id="newTextBtn" type="button">New Text</button>
            <button id="dailyTextBtn" type="button">HSK4-5 Text</button>
            <button id="translateBtn" type="button">Translate</button>
          </div>
        </header>

        <section class="source-strip" aria-label="current text source">
          <span id="sourceLabel">Source pending</span>
          <span id="statusLabel">Ready</span>
        </section>

        <article class="text-card">
          <div id="hanziText" class="hanzi-text" aria-label="Chinese text"></div>
          <div id="pinyinText" class="pinyin-text" aria-label="Pinyin text"></div>
        </article>

        <article class="translation-card">
          <h2>English Translation</h2>
          <p id="translationText">Choose New Text to load a passage.</p>
        </article>

        <article class="vocab-card">
          <h2>Daily Words</h2>
          <div id="vocabList" class="vocab-list"></div>
        </article>
      </section>

      <aside class="character-pane" aria-label="selected character details">
        <div class="character-header">
          <span id="selectedCharacter" class="selected-character">字</span>
          <div>
            <p id="selectedPinyin" class="selected-pinyin">zi4</p>
            <h2 id="selectedMeaning">character</h2>
          </div>
        </div>

        <section class="stroke-box">
          <div class="section-title">
            <h3>Stroke Order</h3>
            <span id="strokeStatus">Select a character</span>
          </div>
          <svg id="strokeSvg" viewBox="0 0 1024 1024" role="img" aria-label="stroke order diagram"></svg>
        </section>

        <section class="details-box">
          <h3>Details</h3>
          <dl>
            <div>
              <dt>Hanzi</dt>
              <dd id="detailHanzi">字</dd>
            </div>
            <div>
              <dt>Pinyin</dt>
              <dd id="detailPinyin">zi4</dd>
            </div>
            <div>
              <dt>Meaning</dt>
              <dd id="detailMeaning">written character; word</dd>
            </div>
          </dl>
        </section>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.27.0/dist/index.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
